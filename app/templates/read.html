<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>{{ book.title }} - อ่านหนังสือ | PRCT Library</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y pinch-zoom;
    }
    /* Smooth transitions for UI bars */
    .reader-bar {
      transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
    }
    .reader-bar.hidden-bar {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .reader-bar-bottom.hidden-bar {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }
    /* Night reading mode */
    .reader-night-mode {
      background-color: #121827 !important;
    }
    .reader-night-mode canvas {
      filter: invert(0.9) hue-rotate(180deg) brightness(0.95) contrast(1.1);
    }
  </style>
</head>
<body id="readerBody" class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-full flex flex-col overflow-hidden">

  <!-- Top Reader Header Bar (Fixed) -->
  <header id="topBar" class="reader-bar fixed top-0 left-0 right-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-5xl mx-auto px-3 h-14 flex items-center justify-between">
      
      <!-- Back to Library -->
      <a href="/" class="flex items-center gap-1.5 py-1 px-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-xs font-semibold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline">คลังหนังสือ</span>
      </a>

      <!-- Book Title & Progress -->
      <div class="flex-1 mx-2 text-center overflow-hidden">
        <h1 class="text-xs sm:text-sm font-bold truncate text-slate-800 dark:text-slate-100">
          {{ book.title }}
        </h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400">
          โดย {{ book.author }}
        </p>
      </div>

      <!-- Reader Controls: Night mode & Fullscreen -->
      <div class="flex items-center gap-1.5">
        <button 
          id="nightModeBtn" 
          onclick="toggleNightMode()" 
          title="โหมดมืด / กลางคืน"
          class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>

        <button 
          onclick="toggleFullscreen()" 
          title="เต็มจอ"
          class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
      </div>

    </div>

    <!-- Reading Progress Indicator Bar -->
    <div class="w-full bg-slate-200 dark:bg-slate-800 h-1">
      <div id="readProgressBar" class="bg-indigo-600 h-1 transition-all duration-300" style="width: 0%;"></div>
    </div>
  </header>

  <!-- Main Canvas Container -->
  <main id="viewportContainer" class="flex-1 overflow-auto pt-16 pb-20 flex flex-col items-center justify-start p-2 sm:p-4 touch-pinch-zoom">
    
    <!-- Loading Spinner -->
    <div id="loadingIndicator" class="flex flex-col items-center justify-center py-24 space-y-3">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="text-xs font-semibold text-slate-500 animate-pulse">กำลังโหลดไฟล์ PDF...</p>
    </div>

    <!-- Error Box -->
    <div id="errorIndicator" class="hidden max-w-sm mx-auto my-12 p-5 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 rounded-2xl text-rose-700 dark:text-rose-300 text-center space-y-2">
      <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto text-rose-500"></i>
      <p class="font-bold text-sm">ไม่สามารถเปิดอ่านไฟล์ PDF ได้</p>
      <p id="errorMessage" class="text-xs">กรุณาลองใหม่อีกครั้ง</p>
      <button onclick="location.reload()" class="mt-2 px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-medium">โหลดใหม่</button>
    </div>

    <!-- Canvas Wrapper for PDF page -->
    <div id="canvasWrapper" class="relative shadow-2xl rounded-lg overflow-hidden bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 max-w-full">
      <canvas id="pdfCanvas" class="block"></canvas>
    </div>

    <!-- Tap helper hint (fades away) -->
    <div id="tapHint" class="mt-3 text-[11px] text-slate-400 dark:text-slate-500 flex items-center gap-1.5 select-none">
      <i data-lucide="hand" class="w-3.5 h-3.5"></i>
      <span>แตะซ้าย/ขวาเพื่อเปลี่ยนหน้า หรือปัดหน้าจอ (Swipe)</span>
    </div>

  </main>

  <!-- Bottom Floating Toolbar (Fixed) -->
  <footer id="bottomBar" class="reader-bar reader-bar-bottom fixed bottom-0 left-0 right-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-lg px-4 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      
      <!-- Prev Page Button -->
      <button 
        id="prevBtn" 
        onclick="onPrevPage()" 
        disabled
        class="flex items-center gap-1 px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-indigo-50 hover:text-indigo-600 disabled:opacity-40 disabled:pointer-events-none transition-all"
      >
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
        <span>ก่อนหน้า</span>
      </button>

      <!-- Page Indicator / Quick Jump -->
      <div class="flex items-center gap-1.5 text-xs font-medium text-slate-600 dark:text-slate-300">
        <span>หน้า</span>
        <input 
          type="number" 
          id="pageInput" 
          min="1" 
          value="{{ last_page or 1 }}"
          onchange="onPageInputChange(this.value)"
          class="w-12 text-center py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold focus:ring-1 focus:ring-indigo-500"
        >
        <span>/</span>
        <span id="totalPages">--</span>
      </div>

      <!-- Next Page Button -->
      <button 
        id="nextBtn" 
        onclick="onNextPage()" 
        disabled
        class="flex items-center gap-1 px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 disabled:opacity-40 disabled:pointer-events-none shadow-sm shadow-indigo-600/30 transition-all"
      >
        <span>ถัดไป</span>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>

      <!-- Zoom Controls -->
      <div class="hidden sm:flex items-center gap-1 pl-2 border-l border-slate-200 dark:border-slate-800">
        <button onclick="zoomOut()" title="ซูมออก" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="zoom-out" class="w-4 h-4"></i>
        </button>
        <button onclick="resetZoom()" title="พอดีหน้าจอ" class="px-2 py-1 rounded-lg text-[10px] font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800">
          พอดีจอ
        </button>
        <button onclick="zoomIn()" title="ซูมเข้า" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="zoom-in" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </footer>

  <script>
    lucide.createIcons();

    // Configuration
    const BOOK_ID = {{ book.id }};
    const PDF_URL = "/api/books/{{ book.id }}/pdf";
    let SAVED_PAGE = {{ last_page or 1 }};

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let pageNum = SAVED_PAGE;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let userZoomFactor = 1.0;
    let isNightMode = false;
    let barsVisible = true;

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorIndicator = document.getElementById('errorIndicator');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const pageInput = document.getElementById('pageInput');
    const totalPagesSpan = document.getElementById('totalPages');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const readProgressBar = document.getElementById('readProgressBar');

    // Load PDF
    pdfjsLib.getDocument(PDF_URL).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      totalPagesSpan.textContent = pdfDoc.numPages;
      pageInput.max = pdfDoc.numPages;

      if (pageNum > pdfDoc.numPages) pageNum = 1;

      loadingIndicator.classList.add('hidden');
      canvasWrapper.classList.remove('hidden');

      renderPage(pageNum);
    }).catch(function(error) {
      loadingIndicator.classList.add('hidden');
      errorIndicator.classList.remove('hidden');
      document.getElementById('errorMessage').textContent = error.message || "เกิดข้อผิดพลาดในการเปิดไฟล์";
    });

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        
        // Calculate responsive scale to fit mobile screen width nicely
        const containerWidth = document.getElementById('viewportContainer').clientWidth - 24;
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const fitScale = (containerWidth / unscaledViewport.width) * 0.96;
        
        // Combine with user zoom factor
        const effectiveScale = Math.max(0.6, fitScale * userZoomFactor);
        const viewport = page.getViewport({ scale: effectiveScale });

        // Handle high DPI (Retina display)
        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        };

        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      // Update UI Controls
      pageInput.value = num;
      prevBtn.disabled = (num <= 1);
      nextBtn.disabled = (pdfDoc && num >= pdfDoc.numPages);

      // Update Progress Bar
      if (pdfDoc) {
        const pct = Math.round((num / pdfDoc.numPages) * 100);
        readProgressBar.style.width = pct + "%";
      }

      // Save progress to server
      saveProgress(num);
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function onNextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function onPageInputChange(val) {
      const num = parseInt(val, 10);
      if (isNaN(num) || num < 1 || !pdfDoc || num > pdfDoc.numPages) {
        pageInput.value = pageNum;
        return;
      }
      pageNum = num;
      queueRenderPage(pageNum);
    }

    // Zoom Helpers
    function zoomIn() {
      userZoomFactor = Math.min(2.5, userZoomFactor + 0.2);
      queueRenderPage(pageNum);
    }

    function zoomOut() {
      userZoomFactor = Math.max(0.6, userZoomFactor - 0.2);
      queueRenderPage(pageNum);
    }

    function resetZoom() {
      userZoomFactor = 1.0;
      queueRenderPage(pageNum);
    }

    // Save Reading Progress
    function saveProgress(page) {
      fetch(`/api/books/${BOOK_ID}/progress`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ page: page })
      }).catch(err => console.log("Progress sync note:", err));
    }

    // Night Mode Toggle
    function toggleNightMode() {
      isNightMode = !isNightMode;
      const body = document.getElementById('readerBody');
      const themeIcon = document.getElementById('themeIcon');
      if (isNightMode) {
        body.classList.add('reader-night-mode');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        body.classList.remove('reader-night-mode');
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    }

    // Toggle Bars (Tap to focus)
    function toggleBars() {
      barsVisible = !barsVisible;
      const topBar = document.getElementById('topBar');
      const bottomBar = document.getElementById('bottomBar');
      if (barsVisible) {
        topBar.classList.remove('hidden-bar');
        bottomBar.classList.remove('hidden-bar');
      } else {
        topBar.classList.add('hidden-bar');
        bottomBar.classList.add('hidden-bar');
      }
    }

    // Mobile Swipe & Tap Gestures for Reading
    let touchStartX = 0;
    let touchStartY = 0;

    canvasWrapper.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvasWrapper.addEventListener('touchend', function(e) {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // Check if horizontal swipe
      if (Math.abs(diffX) > 45 && Math.abs(diffY) < 50) {
        if (diffX < 0) {
          onNextPage(); // Swiped left -> next page
        } else {
          onPrevPage(); // Swiped right -> prev page
        }
      } else if (Math.abs(diffX) < 15 && Math.abs(diffY) < 15) {
        // Tap gesture:
        // Left 25% of canvas -> prev page
        // Right 25% of canvas -> next page
        // Center 50% -> toggle bars
        const rect = canvasWrapper.getBoundingClientRect();
        const tapX = touchEndX - rect.left;
        const width = rect.width;
        if (tapX < width * 0.25) {
          onPrevPage();
        } else if (tapX > width * 0.75) {
          onNextPage();
        } else {
          toggleBars();
        }
      }
    }, { passive: true });

    // Keyboard Arrow navigation
    window.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        onNextPage();
      } else if (e.key === 'ArrowLeft') {
        onPrevPage();
      }
    });

    // Resize listener for orientation change on mobile
    window.addEventListener('resize', function() {
      queueRenderPage(pageNum);
    });
  </script>
</body>
</html>
